name: Public installers and signed preview updates
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scarrix-public-release
  cancel-in-progress: true
jobs:
  scarrix-mod:
    name: Scarrix HUD (Minecraft 26.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: gradle -p scarrix-mod build --no-daemon --console plain
      - name: Prepare virtual display for Minecraft client tests
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Exercise Scarrix menus and HUD dragging in Minecraft
        run: xvfb-run -a gradle -p scarrix-mod runClientGameTest --no-daemon --console plain
      - name: Store Minecraft client test screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scarrix-hud-tests
          path: |
            scarrix-mod/build/run/clientGameTest/screenshots
            scarrix-mod/build/run/clientGameTest/logs
            scarrix-mod/build/test-results
      - run: npm run mod:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: scarrix-hud-bundle
          path: assets/mods/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: scarrix-installer-mod
          path: scarrix-mod/build/libs/*.jar
          if-no-files-found: error
  build:
    needs: scarrix-mod
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Native library prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: scarrix-hud-bundle
          path: assets/mods
      - name: Install prepared cape-service test dependencies
        run: npm ci --prefix community-capes-server --ignore-scripts --no-audit --no-fund
      - name: Stamp unique preview version
        run: node scripts/prepare-release.cjs
      - name: Check TypeScript and run tests
        run: |
          npm run typecheck
          npm test
          npm test --prefix community-capes-server
      - name: Build installer and update metadata
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- --publish never
      - name: Verify packaged Windows Microsoft broker
        if: runner.os == 'Windows'
        run: node scripts/check-native-auth.cjs
      - run: node scripts/update-metadata.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: scarrix-installer-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: scarrix-installer-*
          path: release-assets
          merge-multiple: true
      - name: Cryptographically sign released files
        env:
          SCARRIX_UPDATE_PRIVATE_KEY: ${{ secrets.SCARRIX_UPDATE_PRIVATE_KEY }}
        run: node scripts/sign-updates.cjs release-assets
      - name: Publish public preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          base=$(node -p "require('./package.json').version.split('-')[0]")
          tag="v${base}-beta.${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; published update files remain immutable."
            exit 0
          fi
          gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --title "Scarrix Client ${base} Preview #${GITHUB_RUN_NUMBER}" --prerelease --notes "Öffentliche Preview. Windows EXE, macOS DMG/ZIP, Linux AppImage/DEB. Microsoft-Anmeldung integriert. In-App-Installation nur bei vorhandener, gültiger scarrix-update.sig. Installer haben kein kostenpflichtiges Authenticode-Zertifikat; Windows kann SmartScreen anzeigen."
